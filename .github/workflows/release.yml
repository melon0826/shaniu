name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "V*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v1.2.3. Defaults to the current ref name."
        required: false
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build release assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve version
        id: vars
        shell: bash
        run: |
          input_version="$(jq -r '.inputs.version // ""' "${GITHUB_EVENT_PATH}")"
          if [[ -n "${input_version}" ]]; then
            version="${input_version}"
            publish_release="true"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
            publish_release="true"
          else
            version="dev-${GITHUB_SHA::7}"
            publish_release="false"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "publish_release=${publish_release}" >> "${GITHUB_OUTPUT}"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.5"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build

      - name: Build binaries
        shell: bash
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist build
          ldflags="-s -w -X github.com/melon0826/shaniu/core.compiled_at=${VERSION}"

          targets=(
            "linux amd64"
            "linux arm64"
            "darwin amd64"
            "darwin arm64"
            "windows amd64"
          )

          for target in "${targets[@]}"; do
            read -r goos goarch <<< "${target}"
            name="shaniu_${VERSION}_${goos}_${goarch}"
            binary="${name}"
            if [[ "${goos}" == "windows" ]]; then
              binary="${name}.exe"
            fi

            GOOS="${goos}" GOARCH="${goarch}" CGO_ENABLED=0 go build \
              -trimpath \
              -ldflags="${ldflags}" \
              -o "build/${binary}" .

            package_dir="build/${name}-package"
            rm -rf "${package_dir}"
            mkdir -p "${package_dir}/proto3"
            cp "build/${binary}" "${package_dir}/${binary}"
            cp proto3/shaniu.js proto3/shaniu.d.ts proto3/srpc.js "${package_dir}/proto3/"
            cp proto3/shaniu.py proto3/srpc_pb2.py proto3/srpc_pb2_grpc.py "${package_dir}/proto3/"

            if [[ "${goos}" == "windows" ]]; then
              (cd "${package_dir}" && zip -r "../../dist/${name}.zip" "${binary}" proto3)
            else
              tar -czf "dist/${name}.tar.gz" -C "${package_dir}" "${binary}" proto3
            fi
          done

          sha256sum dist/* > dist/checksums.txt

      - name: Publish GitHub Release
        if: steps.vars.outputs.publish_release == 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ steps.vars.outputs.version }}
          name: Shaniu ${{ steps.vars.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/*

      - name: Upload build artifacts
        if: steps.vars.outputs.publish_release != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: shaniu-${{ steps.vars.outputs.version }}
          path: dist/*

  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve image metadata
        id: vars
        shell: bash
        run: |
          input_version="$(jq -r '.inputs.version // ""' "${GITHUB_EVENT_PATH}")"
          if [[ -n "${input_version}" ]]; then
            version="${input_version}"
            publish_latest="true"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
            publish_latest="true"
          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            version="dev-${GITHUB_SHA::7}"
            publish_latest="true"
          else
            version="dev-${GITHUB_SHA::7}"
            publish_latest="false"
          fi
          dockerhub_image="docker.io/melon0826/shaniu"
          ghcr_image="ghcr.io/melon0826/shaniu"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          {
            echo "ghcr_tags<<EOF"
            echo "${ghcr_image}:${version}"
            if [[ "${publish_latest}" == "true" ]]; then
              echo "${ghcr_image}:latest"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"
          {
            echo "dockerhub_tags<<EOF"
            echo "${dockerhub_image}:${version}"
            if [[ "${publish_latest}" == "true" ]]; then
              echo "${dockerhub_image}:latest"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != '' }}
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: docker.io
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build and push image (GHCR)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
          cache-from: type=gha,scope=shaniu-docker
          cache-to: type=gha,mode=max,scope=shaniu-docker
          tags: ${{ steps.vars.outputs.ghcr_tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.vars.outputs.version }}

      - name: Build and push image (Docker Hub)
        if: ${{ env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != '' }}
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
          cache-from: type=gha,scope=shaniu-docker
          cache-to: type=gha,mode=max,scope=shaniu-docker
          tags: ${{ steps.vars.outputs.dockerhub_tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.vars.outputs.version }}
