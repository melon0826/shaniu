name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v1.2.3. Defaults to the current ref name."
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build release assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Resolve version
        id: vars
        shell: bash
        run: |
          input_version="$(jq -r '.inputs.version // ""' "${GITHUB_EVENT_PATH}")"
          if [[ -n "${input_version}" ]]; then
            version="${input_version}"
            publish_release="true"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
            publish_release="true"
          else
            version="dev-${GITHUB_SHA::7}"
            publish_release="false"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "publish_release=${publish_release}" >> "${GITHUB_OUTPUT}"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.26.5"

      - name: Set up Node.js
        uses: actions/setup-node@32f57ac043e003bc1b07edcb2b9102bbbf3e92f1
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build

      - name: Build binaries
        shell: bash
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist build
          ldflags="-s -w -X github.com/melon0826/shaniu/core.compiled_at=${VERSION}"

          targets=(
            "linux amd64"
            "linux arm64"
            "darwin amd64"
            "darwin arm64"
            "windows amd64"
          )

          for target in "${targets[@]}"; do
            read -r goos goarch <<< "${target}"
            name="shaniu_${VERSION}_${goos}_${goarch}"
            binary="${name}"
            if [[ "${goos}" == "windows" ]]; then
              binary="${name}.exe"
            fi

            GOOS="${goos}" GOARCH="${goarch}" CGO_ENABLED=0 go build \
              -trimpath \
              -ldflags="${ldflags}" \
              -o "build/${binary}" .

            if [[ "${goos}" == "windows" ]]; then
              (cd build && zip "../dist/${name}.zip" "${binary}")
            else
              tar -czf "dist/${name}.tar.gz" -C build "${binary}"
            fi
          done

          sha256sum dist/* > dist/checksums.txt

      - name: Publish GitHub Release
        if: steps.vars.outputs.publish_release == 'true'
        uses: softprops/action-gh-release@5018f9ec04d67dca7353bf3f40a0933e8d7ddf24
        with:
          tag_name: ${{ steps.vars.outputs.version }}
          name: Shaniu ${{ steps.vars.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/*

      - name: Upload build artifacts
        if: steps.vars.outputs.publish_release != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: shaniu-${{ steps.vars.outputs.version }}
          path: dist/*

  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Resolve image metadata
        id: vars
        shell: bash
        run: |
          input_version="$(jq -r '.inputs.version // ""' "${GITHUB_EVENT_PATH}")"
          if [[ -n "${input_version}" ]]; then
            version="${input_version}"
            publish_latest="true"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
            publish_latest="true"
          else
            version="dev-${GITHUB_SHA::7}"
            publish_latest="true"
          fi
          image="ghcr.io/melon0826/shaniu"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          {
            echo "docker_tags<<EOF"
            echo "${image}:${version}"
            if [[ "${publish_latest}" == "true" ]]; then
              echo "${image}:latest"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@5b9cf3909b54a280b6df6eee035755eb1f2fd611

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@cb941d0b895b09c17fa011d41c411b33c752cf28
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
          cache-from: type=gha,scope=shaniu-docker
          cache-to: type=gha,mode=max,scope=shaniu-docker
          tags: ${{ steps.vars.outputs.docker_tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.vars.outputs.version }}
